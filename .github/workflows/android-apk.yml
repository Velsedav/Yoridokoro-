name: Build Android APK

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Build Renderer and Sync Capacitor Android
        run: |
          npm run build
          npx cap sync android

      - name: Build Android APK (Gradle assembleDebug)
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Prepare APK Artifact
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk Yoridokoro-0.2.21-Android.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Yoridokoro-Android-APK
          path: Yoridokoro-0.2.21-Android.apk
          if-no-files-found: error
